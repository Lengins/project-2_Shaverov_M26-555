[project]
name = "primitive-db"
version = "0.4.0"
description = "primitive database in terminal"
readme = "README.md"
authors = [
    { name = "Artem Shaverov", email = "studiwanov@yandex.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "prompt>=0.4.1",
    "prettytable>=3.10",
]

[project.scripts]
database = "primitive_db.main:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [".venv", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = ["ruff>=0.17.1"]
